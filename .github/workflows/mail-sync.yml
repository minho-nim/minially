name: 미니로그 메일 자동 받기

# 15분마다 미니로그의 메일 받기 주소를 부른다(숫자만 돌려받음). 토큰이 없으면 아무것도 하지 않는다.
# 같은 사람 것이 동시에 두 번 돌지 않게 서버가 잠그고, 여기서도 한 번에 하나만 돈다.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN: ${{ secrets.MAIL_CRON_TOKEN }}
    steps:
      - name: 메일 받기
        if: env.TOKEN != ''
        run: |
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 90 -X POST https://mini-log.pages.dev/api/mail/cron -H "authorization: Bearer $TOKEN")
          cat result.json; echo
          test "$code" = 200
