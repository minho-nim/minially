name: 미니어리 검사

# PR 때 미니어리를 미리 시험한다. 지금까지는 병합 뒤 배포 작업(deploy-pages.yml)에서만 돌아서,
# 깨진 코드가 main에 들어간 뒤에야 알 수 있었다. 같은 시험을 PR에서 먼저 돌린다(실제 API·크레딧 없음).
on:
  pull_request:
    paths: ['minially/**', '.github/workflows/minially-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minially-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: minially
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: minially/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test tests/*.unit.mjs
      - run: npm run desktop:prepare
      - run: npm run test:desktop:unit
      # 시스템 패키지 서버가 안 잡힐 때가 있어, 3분 안에 안 끝나면 브라우저만 설치한다(deploy-pages.yml과 같음)
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:sync -- --trace off
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm test -- --trace off --workers 3
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run build:pages
