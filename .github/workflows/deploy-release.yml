# 운영 배포는 Windows 앱 공개가 성공한 뒤 같은 커밋으로 이어진다.
# 수동 실행도 같은 커밋의 Windows 공개 버전이 있어야 진행한다.
# release 브랜치는 검사된 main으로만 fast-forward한다.
name: 운영 배포(release)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows 앱 빌드 및 배포"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 미니어리 앱은 minihub 저장소의 minially 폴더에 있다.
    defaults:
      run:
        working-directory: minially
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Cloudflare 빌드 폴더 변경 확인(minihub 구조)
        env:
          LAYOUT_READY: ${{ vars.MINIHUB_LAYOUT_READY }}
        run: |
          # 앱이 minially 폴더로 옮겨졌다. Cloudflare Pages(minially)의 Root directory를 minially로 바꾸기 전에
          # release를 앞당기면 운영 빌드가 깨지므로, 소유자가 저장소 변수 MINIHUB_LAYOUT_READY=true를 넣을 때까지 멈춘다.
          if [ "$LAYOUT_READY" != "true" ]; then
            echo "::error::Cloudflare Pages(minially) 설정에서 Root directory를 minially로 바꾼 뒤, 저장소 변수 MINIHUB_LAYOUT_READY를 true로 넣고 다시 실행하세요."
            exit 1
          fi
      - name: main의 검사(타입 검사·빌드) 통과 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse origin/main)
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "Deploy Minially to GitHub Pages")][0].conclusion // "none"')
          echo "main ${sha:0:7} 검사: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::main 최신 커밋의 검사가 성공이 아닙니다(${conclusion}). 끝날 때까지 기다리거나 오류를 고친 뒤 다시 실행하세요."
            exit 1
          fi
      - name: 같은 커밋의 Windows 앱 공개 확인
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha=$(git rev-parse origin/main)
          if [ -n "$TRIGGER_SHA" ] && [ "$TRIGGER_SHA" != "$sha" ]; then
            echo "::error::main이 앱 빌드 이후 변경됐습니다. 최신 커밋의 앱을 먼저 배포하세요."
            exit 1
          fi
          version=$(node -p "require('./desktop/package.json').version")
          gh release view "desktop-v${version}" --json isDraft,targetCommitish,assets > "$RUNNER_TEMP/minially-desktop-release.json"
          export EXPECTED_SHA="$sha"
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const release=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/minially-desktop-release.json','utf8'));
          assert.equal(release.isDraft,false,'Windows 앱이 아직 공개되지 않았습니다.');
          assert.equal(release.targetCommitish,process.env.EXPECTED_SHA,'웹과 앱의 소스 커밋이 다릅니다.');
          for(const name of ['Minially-Setup.exe','Minially-Setup.exe.blockmap','latest.yml'])assert(release.assets.some(asset=>asset.name===name),'Windows 배포 파일이 없습니다: '+name);
          console.log('같은 커밋의 Windows 설치 파일·자동 업데이트 피드 공개를 확인했습니다.');
          JS
          # 앱이 실제로 보는 전용 배포판(minially-latest)의 업데이트 안내도 같은 버전인지 확인
          gh release download minially-latest -p latest.yml -O "$RUNNER_TEMP/minially-latest.yml" --clobber
          grep -q "^version: ${version}$" "$RUNNER_TEMP/minially-latest.yml" || { echo "::error::minially-latest 배포판이 ${version}이 아닙니다."; exit 1; }
          echo "minially-latest 배포판도 ${version}입니다."
      - name: release를 main으로 앞당기기(fast-forward만)
        run: |
          if git rev-parse --verify -q origin/release >/dev/null; then
            if ! git merge-base --is-ancestor origin/release origin/main; then
              echo "::error::release가 main과 갈라져 있습니다(release에만 있는 커밋). 덮어쓰지 않습니다."
              exit 1
            fi
            if [ "$(git rev-parse origin/release)" = "$(git rev-parse origin/main)" ]; then
              echo "release가 이미 main과 같습니다. 배포할 것이 없습니다."
              exit 0
            fi
          fi
          from=$(git rev-parse --short origin/release 2>/dev/null || echo none)
          git push origin origin/main:refs/heads/release
          echo "release: ${from} → $(git rev-parse --short origin/main). Cloudflare 빌드가 끝나면(1~2분) 사이트에 반영됩니다."
      - name: 운영 반영 확인(버전)
        # Cloudflare가 release push를 받아 자동으로 빌드한다(GitHub 앱 권한 필요). 사이트의 version.json 커밋이 main과 같아질 때까지 최대 10분 확인하고,
        # 5분이 지나도 그대로면 예비로 배포 훅(secret CLOUDFLARE_DEPLOY_HOOK)으로 빌드를 요청한다.
        env:
          SITE: ${{ vars.SITE_URL || 'https://minially.pages.dev' }}
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          want=$(git rev-parse --short=7 origin/main)
          echo "기대 버전: ${want}"
          kicked=0
          for i in $(seq 1 40); do
            have=$(curl -fsS "${SITE}/version.json?nc=${RANDOM}" 2>/dev/null | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$have" = "$want" ]; then echo "운영 사이트가 ${want}로 바뀌었어요($((i * 15))초)."; exit 0; fi
            if [ "$i" -eq 20 ] && [ -n "$HOOK" ] && [ "$kicked" -eq 0 ]; then
              echo "5분이 지나도 그대로(${have:-없음})라 Cloudflare에 다시 빌드를 요청해요."; curl -fsS -X POST "$HOOK" >/dev/null && kicked=1 || true
            fi
            sleep 15
          done
          echo "::error::10분이 지나도 운영 사이트가 ${want}가 아니에요(지금 ${have:-확인 불가}). Cloudflare Deployments에서 빌드 상태를 확인하세요."
          exit 1
