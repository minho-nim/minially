name: 미니허브·미니로그 검사

# hub·mini-log·shared가 바뀔 때 타입 검사·빌드·서버 포함 시험을 돌린다(가짜 Gemini 사용, 실제 API·크레딧 없음).
on:
  push:
    branches: [main]
    paths: ['hub/**', 'mini-log/**', 'shared/**', '.github/workflows/hub-minilog-check.yml']
  pull_request:
    paths: ['hub/**', 'mini-log/**', 'shared/**', '.github/workflows/hub-minilog-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [hub, mini-log]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm test -- --trace off
        env:
          PLAYWRIGHT_CHANNEL: chromium
