name: Windows 앱 빌드 및 배포

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        # 미니어리 앱은 minihub 저장소의 minially 폴더에 있다.
        working-directory: minially
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: minially/package-lock.json
      - name: main 커밋과 새 버전 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          sha=$(git rev-parse HEAD)
          test "$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)" = "$sha"
          version=$(node -p "require('./desktop/package.json').version")
          if gh release view "desktop-v${version}" >/dev/null 2>&1; then echo "::error::이미 배포한 버전입니다. 앱 버전을 올려 주세요."; exit 1; fi
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      # 설치 스크립트 전체를 허용하지 않고 검토한 공식 Electron 바이너리 설치만 실행한다.
      - run: node node_modules/electron/install.js
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: node --import tsx --test tests/*.unit.mjs
      - run: npm run desktop:prepare
      - run: npm run test:desktop:unit
      - run: node tests-desktop/smoke.cjs
      - run: node tests-desktop/zoom.cjs
      - name: 테마 업데이트 창 만들기
        shell: pwsh
        run: ./scripts/build-update-window.ps1
      - name: Windows 설치 파일 만들기
        run: npx --no-install electron-builder --config electron-builder.yml --win nsis --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: 실제 Windows 패키지 실행
        run: node tests-desktop/packaged.cjs
      - name: 업데이트 진행 창과 자동 설치 확인
        shell: pwsh
        run: ./tests-desktop/installer.ps1
      - name: 업데이트 창 화면 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-progress-preview
          path: minially/desktop-dist/update-progress.png
          if-no-files-found: error
          retention-days: 7
      - name: 설치 파일과 업데이트 메타데이터 확인
        run: |
          node scripts/check-desktop-release.cjs
      - name: 같은 커밋의 전체 웹 검사 통과 후 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" --jq '[.workflow_runs[] | select(.name == "Deploy Minially to GitHub Pages")][0].conclusion // "pending"')
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" != pending ]; then echo "::error::전체 검사 실패: $result"; exit 1; fi
            sleep 15
          done
          echo "::error::전체 검사를 기다리는 시간이 지났습니다. 설치 파일을 공개하지 않습니다."
          exit 1
      - name: 설치 파일과 업데이트 피드 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v${version}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "미니어리 Windows ${version}" --notes-file desktop/RELEASE-NOTES.md
          gh release upload "$tag" desktop-dist/Minially-Setup.exe desktop-dist/Minially-Setup.exe.blockmap desktop-dist/latest.yml
          gh release edit "$tag" --draft=false --latest
