<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>코드 해시 만들기</title>
<style>
  body { margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; background: #f7f5f2; color: #24211d; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  label { font-weight: 600; display: block; margin: 16px 0 6px; }
  input, select { width: 100%; box-sizing: border-box; min-height: 44px; padding: 8px 12px; border: 1px solid #e3ded6; border-radius: 10px; font: inherit; background: #fff; }
  button { margin-top: 16px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #3d5a4a; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  output { display: block; margin-top: 16px; padding: 12px; background: #fff; border: 1px solid #e3ded6; border-radius: 10px; font-family: ui-monospace, monospace; font-size: 0.85rem; overflow-wrap: anywhere; min-height: 1.6em; }
  p { color: #6b645b; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:1.25rem">로그인 코드 → 해시 만들기</h1>
  <p>코드는 이 브라우저 안에서만 계산하고 어디에도 보내지 않아요. 나온 한 줄을 Cloudflare 비밀값 <b>USER_CODE_HASHES</b>에 넣어요. C와 D를 쉼표로 이어 붙이면 돼요(예: <code>C:abc…,D:def…</code>).</p>
  <form id="f">
    <label for="user">사용자</label>
    <select id="user"><option>C</option><option>D</option></select>
    <label for="code">미니어리 로그인 코드</label>
    <input id="code" type="password" autocomplete="off" spellcheck="false" />
    <button type="submit">해시 만들기</button>
  </form>
  <output id="out" aria-live="polite"></output>
</main>
<script src="/code-hash.js"></script>
</body>
</html>
